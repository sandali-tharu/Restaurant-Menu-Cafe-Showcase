        <h1><b>Need Catering?</b></h1>
        <p>Fill out the form below and tell us about your event. We will be in touch shortly.</p>
        <form action="#" method="POST">

            <p>
                <label>Name</label><br>
                <input type="text" placeholder="First Name" required> (required) <br>
                <input type="text" placeholder="Last Name" required> (required)
            </p>

            <p>
                <label>Phone</label><br>
                <input type="tel" required> (required)
            </p>

            <p>
                <label>Email</label><br>
                <input type="email" required> (required)
            </p>

            <p>
                <label>Date of Your Event?</label><br>
                <input type="date">
            </p>

            <p>
                <label>Time of Day</label><br>
                <input type="time"><br>
                in Pacific Time
            </p>

            <p>
                <label>Tell Us About Your Event</label><br>
                <textarea rows="4" cols="30" required></textarea> (required)
            </p>

            <p>
                <label>Location</label><br>
                <select>
                    <option>Select an option</option>
                    <option>West Seattle (main)</option>
                    <option>U Village</option>
                    <option>Woodinville</option>
                </select>
            </p>

            <button type="submit">Submit Request</button>




        </form>
